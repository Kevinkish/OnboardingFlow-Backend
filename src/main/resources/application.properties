spring.application.name=onboardflow

spring.datasource.url=jdbc:mysql://localhost:3306/onboardflow_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
server.port=8081

spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

jwt.secret=${JWT_SECRET_BASE64}

spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=${mailtrap_username}
spring.mail.password=${mailtrap_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.email.from=no-reply@onboardflow.com
app.email.verification-base-url=http://localhost:8081/auth/verify-email
